<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train loading operations</title>
  <style>
    :root {
      color-scheme: dark;
      --page: oklch(17% 0.025 255);
      --surface: oklch(21% 0.028 255);
      --surface-raised: oklch(25% 0.03 255);
      --line: oklch(37% 0.025 255);
      --line-soft: oklch(29% 0.025 255);
      --ink: oklch(94% 0.012 250);
      --muted: oklch(70% 0.02 250);
      --blue: oklch(69% 0.15 245);
      --green: oklch(72% 0.15 153);
      --amber: oklch(80% 0.16 82);
      --red: oklch(67% 0.2 27);
      --radius: 0.35rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 20rem;
      background: var(--page);
      color: var(--ink);
      font-family: "Avenir Next", "Gill Sans", ui-sans-serif, sans-serif;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 auto 0 0;
      width: 0.3rem;
      background: var(--blue);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1.25rem, 4vw, 4rem) 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    header > div { min-width: 0; }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--blue);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      white-space: nowrap;
    }

    #freshness {
      color: var(--muted);
      font-size: 0.78rem;
    }

    button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.55rem 0.8rem;
      background: var(--surface-raised);
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { border-color: var(--blue); }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.55; }

    main { padding: 1.25rem clamp(1.25rem, 4vw, 4rem) 4rem; }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 2.5rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .summary strong { color: var(--ink); font-weight: 650; }

    #error {
      display: none;
      margin: 0 0 1rem;
      border: 1px solid color-mix(in oklch, var(--red), var(--page) 45%);
      padding: 0.7rem 0.8rem;
      color: oklch(88% 0.07 25);
      background: color-mix(in oklch, var(--red), var(--page) 84%);
    }

    #error.visible { display: block; }

    .table-shell {
      overflow-x: auto;
      border-block: 1px solid var(--line);
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 72rem;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 0.72rem 0.8rem;
      border-bottom: 1px solid var(--line);
      background: var(--surface-raised);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.075em;
      text-align: left;
      text-transform: uppercase;
    }

    td {
      padding: 0.85rem 0.8rem;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: color-mix(in oklch, var(--blue), var(--surface) 94%); }

    .identifier {
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.76rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .station {
      font-weight: 650;
      letter-spacing: 0.025em;
    }

    .departure {
      color: var(--ink);
      font-size: 1rem;
      font-weight: 700;
    }

    .loading-cell { min-width: 23rem; }

    .loading-heading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.12rem 0.45rem;
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status--available { border-color: color-mix(in oklch, var(--green), var(--line) 40%); color: var(--green); }
    .status--stale { border-color: color-mix(in oklch, var(--amber), var(--line) 40%); color: var(--amber); }

    .location { color: var(--muted); font-size: 0.72rem; }

    .coaches {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .coach {
      position: relative;
      display: grid;
      grid-template-columns: auto auto;
      gap: 0.35rem;
      min-width: 4.5rem;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0.2rem;
      padding: 0.3rem 0.4rem;
      background: var(--page);
      font-size: 0.69rem;
    }

    .coach::before {
      content: "";
      position: absolute;
      inset: auto auto 0 0;
      width: var(--load, 0%);
      height: 0.18rem;
      background: var(--band, var(--line));
    }

    .coach--green { --band: var(--green); }
    .coach--amber { --band: var(--amber); }
    .coach--red { --band: var(--red); }
    .coach span { color: var(--muted); }
    .coach strong { font-weight: 700; text-align: right; }

    .empty-loading, .empty-state { color: var(--muted); }

    .empty-state td {
      padding: 4rem 1rem;
      text-align: center;
    }

    .last-update { white-space: nowrap; }
    .last-update time { display: block; color: var(--ink); }
    .relative { color: var(--muted); font-size: 0.72rem; }

    @media (max-width: 45rem) {
      header { align-items: start; flex-direction: column; gap: 1rem; }
      .eyebrow, h1 { overflow-wrap: anywhere; }
      .controls { width: 100%; max-width: 100%; flex-wrap: wrap; justify-content: space-between; }
      main { padding-top: 0.75rem; }
      .summary { align-items: start; flex-direction: column; gap: 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      tbody tr { animation: arrive 240ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">TrainTrack UK · Operations</p>
      <h1>Live carriage loading</h1>
    </div>
    <div class="controls">
      <span id="freshness" aria-live="polite">Connecting…</span>
      <button id="refresh" type="button">Refresh now</button>
    </div>
  </header>

  <main>
    <div class="summary">
      <span id="summary">Loading active services…</span>
      <span>Auto-refreshes every 15 seconds</span>
    </div>
    <p id="error" role="alert"></p>

    <div class="table-shell">
      <table>
        <thead>
          <tr>
            <th scope="col">Service ID</th>
            <th scope="col">Start</th>
            <th scope="col">End</th>
            <th scope="col">Departure</th>
            <th scope="col">RID</th>
            <th scope="col">Loading data</th>
            <th scope="col">Last update</th>
          </tr>
        </thead>
        <tbody id="services">
          <tr class="empty-state"><td colspan="7">Loading active services…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const endpoint = new URL("api/v1/admin/services", window.location.href);
    const body = document.querySelector("#services");
    const summary = document.querySelector("#summary");
    const freshness = document.querySelector("#freshness");
    const error = document.querySelector("#error");
    const refreshButton = document.querySelector("#refresh");
    let refreshing = false;

    function textElement(tag, value, className) {
      const element = document.createElement(tag);
      element.textContent = value;
      if (className) element.className = className;
      return element;
    }

    function departureMinutes(value) {
      if (!value || !/^\d{2}:\d{2}$/.test(value)) return Number.POSITIVE_INFINITY;
      const [hours, minutes] = value.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function relativeTime(value) {
      if (!value) return "Awaiting Darwin";
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      return `${Math.floor(seconds / 3600)}h ago`;
    }

    function loadingCell(service) {
      const cell = document.createElement("td");
      cell.className = "loading-cell";

      const heading = document.createElement("div");
      heading.className = "loading-heading";
      const status = textElement("span", service.status.replaceAll("_", " "), `status status--${service.status}`);
      heading.append(status);
      if (service.location?.tiploc) heading.append(textElement("span", `at ${service.location.tiploc}`, "location"));
      cell.append(heading);

      if (!service.loading?.length) {
        cell.append(textElement("span", "No formation or loading data yet", "empty-loading"));
        return cell;
      }

      const coaches = document.createElement("div");
      coaches.className = "coaches";
      for (const item of [...service.loading].sort((a, b) => a.position - b.position)) {
        const coach = document.createElement("div");
        coach.className = `coach coach--${item.band ?? "unknown"}`;
        coach.style.setProperty("--load", `${item.percentage ?? 0}%`);
        coach.title = item.percentage == null
          ? `Coach ${item.number}: no live loading data`
          : `Coach ${item.number}: ${item.percentage}% loaded`;
        coach.append(textElement("span", item.number ?? "—"));
        coach.append(textElement("strong", item.percentage == null ? "—" : `${item.percentage}%`));
        coaches.append(coach);
      }
      cell.append(coaches);
      return cell;
    }

    function serviceRow(service) {
      const row = document.createElement("tr");
      row.append(textElement("td", service.serviceID ?? "RID only", "identifier"));
      row.append(textElement("td", service.startStation ?? "—", "station"));
      row.append(textElement("td", service.endStation ?? "—", "station"));
      row.append(textElement("td", service.scheduledDeparture ?? "—", "departure"));
      row.append(textElement("td", service.rid, "identifier"));
      row.append(loadingCell(service));

      const updated = document.createElement("td");
      updated.className = "last-update";
      if (service.lastUpdate) {
        const time = document.createElement("time");
        time.dateTime = service.lastUpdate;
        time.textContent = new Date(service.lastUpdate).toLocaleTimeString("en-GB", {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
        });
        updated.append(time);
      }
      updated.append(textElement("span", relativeTime(service.lastUpdate), "relative"));
      row.append(updated);
      return row;
    }

    function render(services) {
      const ordered = [...services].sort((left, right) => {
        const difference = departureMinutes(left.scheduledDeparture) - departureMinutes(right.scheduledDeparture);
        return difference || (left.serviceID ?? left.rid).localeCompare(right.serviceID ?? right.rid);
      });
      body.replaceChildren();

      if (!ordered.length) {
        const row = document.createElement("tr");
        row.className = "empty-state";
        const cell = textElement("td", "No active service interests. Open a journey in the app to register one.");
        cell.colSpan = 7;
        row.append(cell);
        body.append(row);
      } else {
        ordered.forEach((service) => body.append(serviceRow(service)));
      }

      const available = ordered.filter((service) => service.status === "available").length;
      summary.replaceChildren(
        textElement("strong", `${ordered.length} active service${ordered.length === 1 ? "" : "s"}`),
        document.createTextNode(` · ${available} with live loading`),
      );
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      refreshButton.disabled = true;
      try {
        const response = await fetch(endpoint, { cache: "no-store" });
        if (!response.ok) throw new Error(`Admin API returned HTTP ${response.status}`);
        const payload = await response.json();
        render(payload.services ?? []);
        error.classList.remove("visible");
        freshness.textContent = `Updated ${new Date().toLocaleTimeString("en-GB")}`;
      } catch (requestError) {
        error.textContent = requestError.message;
        error.classList.add("visible");
        freshness.textContent = "Update failed";
      } finally {
        refreshing = false;
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", refresh);
    refresh();
    window.setInterval(refresh, 15_000);
  </script>
</body>
</html>
