app = "train-track-loading"
primary_region = "lhr"

[env]
  PORT = "3001"
  TZ = "Europe/London"
  TRAIN_LOADING_TTL_SECONDS = "86400"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 3001
  path = "/metrics"
